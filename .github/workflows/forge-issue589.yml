name: forge-issue589
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Base on upstream main and apply the fix
        run: |
          set -e
          git remote add upstream https://github.com/dsh-market/dsh-market.git
          git fetch upstream main
          git config user.name "JINITAIMEI121"
          git config user.email "JINITAIMEI121@users.noreply.github.com"
          git checkout -B fix/search-local-match-memo upstream/main
          echo '' | base64 -d > /tmp/fix.patch
          git apply /tmp/fix.patch
      - name: Install, test, and rebuild the client bundle
        run: |
          set -e
          corepack enable
          npx pnpm@9 install --no-frozen-lockfile
          npx vitest run tests/sources.spec.ts tests/market-data.spec.ts tests/changelog.spec.ts
          npm run build:client
      - name: Commit and push
        run: |
          set -e
          if ! git cat-file -e upstream/main:pnpm-lock.yaml 2>/dev/null; then
            git rm -f --ignore-unmatch --cached pnpm-lock.yaml > /dev/null 2>&1 || true
            rm -f pnpm-lock.yaml
          fi
          git add -A
          git commit -m "perf(client): memoize local catalog matching in the shared module with a JSON key (#589)"
          git push --force origin fix/search-local-match-memo
