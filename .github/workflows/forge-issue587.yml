name: forge-issue587
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Base on upstream main and apply the fix
        run: |
          set -e
          git remote add upstream https://github.com/dsh-market/dsh-market.git
          git fetch upstream main
          git config user.name "JINITAIMEI121"
          git config user.email "JINITAIMEI121@users.noreply.github.com"
          git checkout -B fix/git-non-interactive-env upstream/main
          echo '' | base64 -d > /tmp/src.patch
          echo '' | base64 -d > /tmp/spec.patch
          git apply /tmp/src.patch
          git apply /tmp/spec.patch
      - name: Install and test
        run: |
          set -e
          corepack enable
          npx pnpm install --frozen-lockfile
          npx vitest run tests/dsh-cli-spawn.spec.ts tests/dsh-cli.spec.ts tests/install.spec.ts
      - name: Commit and push
        run: |
          set -e
          git add -A
          git commit -m "fix(cli): make spawned git fail fast instead of waiting for prompts (#587)"
          git push --force origin fix/git-non-interactive-env
